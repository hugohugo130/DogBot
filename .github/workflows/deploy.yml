name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /home/hugo/${{ secrets.REPO_NAME }}

            git fetch origin main
            slashcmd_changes=$(git diff --name-only HEAD origin/main | grep "slashcmd/")
            git pull origin main

            if [ ! -z "$slashcmd_changes"]; then
              docker restart ${{ secrets.DOCKER_NAME }}
            else
              echo "reload cogs" | docker exec -i ${{ secrets.DOCKER_NAME }} sh -c "cat >> /proc/1/fd/0"
            fi
