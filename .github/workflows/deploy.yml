name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1 https://github.com/actions/checkout/commit/f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Connect to Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.1.3 https://github.com/tailscale/github-action/commit/d1b6cd204f8dceda5b3eaad7f1f767be390056cd
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Wait for Tailscale and check SSH reachable
        run: |
          HOST="${{ secrets.SERVER_HOST }}"
          PORT="${{ secrets.SERVER_PORT }}" || PORT=22

          echo "Checking TCP connectivity"
          attempts=0
          max=12
          sleep_interval=5

          until timeout 3 bash -c "cat < /dev/tcp/$HOST/$PORT" >/dev/null 2>&1; do
            attempts=$((attempts+1))
            echo "Attempt $attempts/$max: $HOST:$PORT not reachable yet"
            if [ "$attempts" -ge "$max" ]; then
              echo "ERROR: SSH port $PORT on $HOST still unreachable after $((max*sleep_interval))s"
              exit 1
            fi
            sleep $sleep_interval
          done
          echo "$HOST:$PORT is reachable"

      - name: SSH and Deploy
        uses: appleboy/ssh-action@c4f70287fc37c43b14b30b407224bbbc8e8c6327 # v1.2.5 https://github.com/appleboy/ssh-action/commit/c4f70287fc37c43b14b30b407224bbbc8e8c6327
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /home/hugo/${{ secrets.REPO_NAME }}

            # git fetch origin main

            # if git diff --name-only HEAD origin/main | grep -q "^slashcmd/"; then
              # git pull origin main
              # docker restart ${{ secrets.DOCKER_NAME }}
            # else
            #   git pull origin main
            #   echo "reload cogs" | docker exec -i ${{ secrets.DOCKER_NAME }} sh -c "cat >> /proc/1/fd/0"
            # fi

            git pull origin main
            docker restart ${{ secrets.DOCKER_NAME }}
